name: Deploy demo to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      fe_ref:
        description: ThatzFit-FE ref used for the loader cache version
        required: false
        default: main
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-pages.yml
      - index.html
      - package-lock.json
      - package.json
      - public/**
      - scripts/**
      - src/**
      - tailwind.config.js
      - tsconfig*.json
      - vite.config.ts

concurrency:
  group: cloudflare-pages-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 5b235593f620ca7c38fa2e0657c0467e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FE version source
        uses: actions/checkout@v4
        with:
          repository: TryOnU-A-Virtual-Fitting-Service/ThatzFit-FE
          ref: ${{ inputs.fe_ref || 'main' }}
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}
          path: _external/ThatzFit-FE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify loader version injection
        run: npm run verify:loader-version

      - name: Build
        env:
          THATZFIT_FE_REPO_PATH: _external/ThatzFit-FE
        run: npm run build

      - name: Deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4.86.0 pages deploy dist \
            --project-name thatzfit-demo \
            --branch "${{ github.ref_name }}" \
            --commit-hash "${{ github.sha }}"
