name: Deploy demo to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-pages.yml
      - index.html
      - package-lock.json
      - package.json
      - public/**
      - src/**
      - tailwind.config.js
      - tsconfig*.json
      - vite.config.ts

concurrency:
  group: cloudflare-pages-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 5b235593f620ca7c38fa2e0657c0467e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@4.86.0 pages deploy dist \
            --project-name thatzfit-demo \
            --branch "${{ github.ref_name }}" \
            --commit-hash "${{ github.sha }}"
